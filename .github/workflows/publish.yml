name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      changelog:
        description: "Changelog entries for this release (separate lines with ' | ')"
        required: false
        default: ""
        type: string
      skip_bump:
        description: "Publish current package.json version only (no changelog/version bump)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: 24
          # Do NOT set registry-url: it writes _authToken=${NODE_AUTH_TOKEN} into
          # .npmrc; an empty token makes npm skip OIDC and fail publish with 403.
          package-manager-cache: false

      - name: Ensure npm supports OIDC publish
        # Pin npm 11 — npm@latest (12.x) has had provenance/OIDC packaging regressions
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # todo: Run tests before publishing
      # - name: Run tests
      #   run: npm test

      - name: Get current version
        if: ${{ !inputs.skip_bump }}
        id: current_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Calculate new version
        if: ${{ !inputs.skip_bump }}
        id: new_version
        run: |
          current="${{ steps.current_version.outputs.version }}"
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) new_version="$((major + 1)).0.0" ;;
            minor) new_version="$major.$((minor + 1)).0" ;;
            patch) new_version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "version=$new_version" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        if: ${{ !inputs.skip_bump }}
        run: |
          # Prepare the new entry
          DATE=$(date +"%Y-%m-%d")
          VERSION="${{ steps.new_version.outputs.version }}"
          CHANGELOG_TEXT="${{ inputs.changelog }}"
          
          # Create a temporary file with the new entry
          echo "## [$VERSION] - $DATE" > /tmp/new_entry.md
          echo "" >> /tmp/new_entry.md
          echo "$CHANGELOG_TEXT" | tr '|' '\n' | while IFS= read -r line; do
            trimmed="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -n "$trimmed" ] && echo "- $trimmed" >> /tmp/new_entry.md
          done
          echo "" >> /tmp/new_entry.md
          
          # Insert new entry after the header, before the first existing version
          FIRST_VERSION_LINE=$(grep -n "^## \[" CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -n "$FIRST_VERSION_LINE" ]; then
            head -n $((FIRST_VERSION_LINE - 1)) CHANGELOG.md > /tmp/changelog_new.md
            cat /tmp/new_entry.md >> /tmp/changelog_new.md
            tail -n +$FIRST_VERSION_LINE CHANGELOG.md >> /tmp/changelog_new.md
            mv /tmp/changelog_new.md CHANGELOG.md
          else
            cat /tmp/new_entry.md >> CHANGELOG.md
          fi
          
          rm -f /tmp/new_entry.md

      - name: Configure git user
        if: ${{ !inputs.skip_bump }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Commit changelog
        if: ${{ !inputs.skip_bump }}
        run: |
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for v${{ steps.new_version.outputs.version }}"

      - name: Bump version
        if: ${{ !inputs.skip_bump }}
        run: |
          npm version ${{ inputs.bump }} -m "Release: v%s"

      - name: Push changes and tags
        if: ${{ !inputs.skip_bump }}
        run: |
          git push
          git push --tags

      - name: Publish to npm
        # Native trusted publishing: npm >= 11.5.1 detects the GitHub Actions
        # OIDC environment, exchanges the ID token with the registry itself and
        # enables provenance automatically. No npm token may be configured
        # anywhere (no NODE_AUTH_TOKEN, no _authToken in any .npmrc), otherwise
        # npm may fall back to token auth and the registry rejects the publish.
        run: npm publish --access public

      - name: Show npm debug log (on failure)
        # The one-line "403 Forbidden - PUT ..." hides the registry's actual
        # rejection reason; the full response is in the npm debug log.
        if: failure()
        run: |
          for f in "$HOME"/.npm/_logs/*.log; do
            echo "=== $f ==="
            cat "$f"
          done

      - name: Diagnose registry rejection (on failure)
        # npm CLI only prints the `error` field of an error response body.
        # Replay the publish via libnpmpublish and dump the raw status,
        # headers and body of the registry's response. Provenance is disabled
        # here, so if this attempt SUCCEEDS the rejection is tied to the
        # provenance/attestation path of the normal publish.
        if: failure()
        run: |
          set -euo pipefail
          OID=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org")
          JWT=$(echo "$OID" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          EXCHANGE=$(curl -sS -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$(node -p "encodeURIComponent('@currentjs/router')")")
          DIAG_TOKEN=$(echo "$EXCHANGE" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).token")
          export DIAG_TOKEN
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL=$(ls "$RUNNER_TEMP"/currentjs-router-*.tgz | head -1)
          export TARBALL
          npm install --no-save --prefix "$RUNNER_TEMP/diag" libnpmpublish
          NODE_PATH="$RUNNER_TEMP/diag/node_modules" node -e '
            const fs = require("fs");
            const { publish } = require("libnpmpublish");
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tarball = fs.readFileSync(process.env.TARBALL);
            (async () => {
              try {
                const res = await publish(manifest, tarball, {
                  access: "public",
                  provenance: false,
                  forceAuth: { token: process.env.DIAG_TOKEN, _authToken: process.env.DIAG_TOKEN },
                });
                console.log("DIAG: publish WITHOUT provenance SUCCEEDED:", res.status || res.statusCode);
              } catch (e) {
                console.log("DIAG statusCode:", e.statusCode);
                console.log("DIAG message:", e.message);
                try { console.log("DIAG headers:", JSON.stringify(e.headers, null, 2)); } catch {}
                console.log("DIAG body:", JSON.stringify(e.body ?? null, null, 2));
              }
            })();
          '
